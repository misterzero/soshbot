version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TS 7 (Go rewrite) breaks Next 15 CSS imports and typescript-eslint.
      # Revisit when eslint-config-next declares TS 7 support.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/infra/envs/staging"
    schedule:
      interval: monthly
