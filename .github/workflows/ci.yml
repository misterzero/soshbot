name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@6044e13b5df448d1b4c8b7ea1e21a3bd8a8e0dc6 # v6.0.1
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Seed demo database
        run: npm run db:push && npm run db:seed

      - name: Build
        run: npm run build

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e12f0178983d466f2f6028f5cd7ae6f0136e5673 # v4.31.9
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@e12f0178983d466f2f6028f5cd7ae6f0136e5673 # v4.31.9

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@6044e13b5df448d1b4c8b7ea1e21a3bd8a8e0dc6 # v6.0.1
        with:
          node-version: 22
          cache: npm

      - name: npm audit (fail on high)
        run: npm audit --audit-level=high
